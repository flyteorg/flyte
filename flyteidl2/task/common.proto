syntax = "proto3";

package flyteidl2.task;

import "buf/validate/validate.proto";
import "flyteidl2/core/artifact_id.proto";
import "flyteidl2/core/interface.proto";
import "flyteidl2/core/literals.proto";
import "flyteidl2/core/types.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/flyteorg/flyte/v2/gen/go/flyteidl2/task";

message NamedParameter {
  string name = 1;

  flyteidl2.core.Parameter parameter = 2;
}

// Represents a frequency at which to run a schedule.
enum FixedRateUnit {
  FIXED_RATE_UNIT_UNSPECIFIED = 0;
  FIXED_RATE_UNIT_MINUTE = 1;
  FIXED_RATE_UNIT_HOUR = 2;
  FIXED_RATE_UNIT_DAY = 3;
}

// Option for schedules run at a certain frequency e.g. every 2 minutes.
message FixedRate {
  uint32 value = 1 [(buf.validate.field).uint32.gt = 0];
  FixedRateUnit unit = 2 [(buf.validate.field).enum = {
    not_in: [0]
  }];

  // Optional, timestamp after which rate should be calculated. Can be only in future.
  // E.g. We create a rate schedule "every 5 minutes" with start_time="12:00" inactive.
  // Activate it at "12:04".
  // Trigger should fire at "12:05" as it adds 5 minutes to start_time="12:00".
  google.protobuf.Timestamp start_time = 3;
}

message Cron {
  // Uses AWS syntax: Minutes Hours Day-of-month Month Day-of-week Year
  // e.g. for a schedule that runs every 15 minutes: 0/15 * * * ? *
  string expression = 1 [(buf.validate.field).string.min_len = 1];

  string timezone = 2; // default is UTC
}

// Defines complete set of information required to trigger an execution on a schedule.
message Schedule {
  oneof expression {
    option (buf.validate.oneof).required = true;

    FixedRate rate = 1;
    string cron_expression = 2 [deprecated = true];
    Cron cron = 4;
  }

  // Name of the input variable that the kickoff time will be supplied to when the workflow is kicked off.
  string kickoff_time_input_arg = 3;
}

enum TriggerAutomationSpecType {
  TYPE_UNSPECIFIED = 0;
  TYPE_NONE = 1;
  TYPE_SCHEDULE = 2;
  TYPE_ARTIFACT = 3;
}

// Fires a run when a new version of the named artifact is created.
message ArtifactTrigger {
  // Name of the artifact to watch, scoped to the trigger's org/project/domain.
  string artifact_name = 1 [(buf.validate.field).string.min_len = 1];

  // Optional: fire only when exactly this version is created. Empty means any new version.
  string version = 2;

  // Name of the task input variable that the triggering artifact's value will be supplied to
  // when the run is kicked off. Mirrors Schedule.kickoff_time_input_arg. Optional; empty means
  // the artifact is not bound to any input.
  string input_arg = 3;
}

message TriggerAutomationSpec {
  // Explicitly defines trigger automation type.
  TriggerAutomationSpecType type = 1 [(buf.validate.field).enum = {
    not_in: [0]
  }];

  oneof automation {
    Schedule schedule = 2;

    ArtifactTrigger artifact = 3;

    // In future will be extended with other automation types: webhook, etc.
  }
}

// Named literal value.
message NamedLiteral {
  // Name of the literal.
  string name = 1;

  // Literal value.
  flyteidl2.core.Literal value = 2;
}

// Output references.
message OutputReferences {
  // The output uri.
  string output_uri = 1;

  // Native URI to HTML report
  string report_uri = 2;
}

// Input payload for an action.
message Inputs {
  // Ordered inputs. THIS FIELD MUST REMAIN FIRST as this would break Run service assumptions if it were to move.
  repeated NamedLiteral literals = 1;

  // Context for the action. If an action receives context, it'll automatically pass it to any actions it spawns.
  // Context will not be used for cache key computation.
  // Examples for context include:
  //  - User-provided metadata that is not part of the action's inputs.
  //  - Information about the environment the action is running in (e.g. cluster, region, etc.)
  //  - Tracing information about the action
  repeated flyteidl2.core.KeyValuePair context = 2;
}

// Declares that a named output of the producing action is a new artifact
// version. The output's literal (in Outputs.literals) is the artifact's value;
// org/project/domain come from the producing action's scope at registration.
message ProducedArtifact {
  // Name of the NamedLiteral in Outputs.literals this declaration refers to.
  string output = 1 [(buf.validate.field).string.min_len = 1];

  // Artifact name to register under.
  string name = 2 [(buf.validate.field).string.min_len = 1];

  // Optional explicit version. Empty means the backend derives one
  // (<run>-<action>-<attempt>).
  string version = 3;

  // Descriptive payload, copied verbatim into ArtifactSpec.info.
  flyteidl2.core.ArtifactInfo info = 4;

  // The declared Flyte type of the output, copied into ArtifactSpec.type.
  // The producing SDK is authoritative for this.
  flyteidl2.core.LiteralType type = 5;

  // Optional version of this same artifact name that the produced version was
  // derived from, copied verbatim into ArtifactSpec.parent_version. Set by the
  // producing task when it derives a new version from one it consumed, so the
  // resulting lineage branches instead of reading as a linear chain.
  string parent_version = 6 [(buf.validate.field).string.max_len = 255];
}

// Output payload for an action.
message Outputs {
  // Ordered outputs. THIS FIELD MUST REMAIN FIRST as this would break Run service assumptions if it were to move.
  repeated NamedLiteral literals = 1;

  // Artifact registration declarations for outputs wrapped as artifacts by the
  // producing task. Field 3 (not 2) on purpose: outputs.pb blobs are sometimes
  // cross-decoded as task.Inputs, where field 2 is `context`; field 3 is unused
  // there, so this never aliases.
  repeated ProducedArtifact produced_artifacts = 3;
}
