syntax = "proto3";

package flyteidl2.task;

import "buf/validate/validate.proto";
import "flyteidl2/common/identifier.proto";
import "flyteidl2/common/identity.proto";
import "flyteidl2/common/list.proto";
import "flyteidl2/task/task_definition.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/flyteorg/flyte/v2/gen/go/flyteidl2/task";

// TaskService provides an interface for managing tasks.
service TaskService {
  // Deploy a task.
  rpc DeployTask(DeployTaskRequest) returns (DeployTaskResponse) {}

  // Get detailed information about a task.
  rpc GetTaskDetails(GetTaskDetailsRequest) returns (GetTaskDetailsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Lists tasks, one per task name, returning the latest version and who it was deployed by.
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Lists all versions for a task.
  rpc ListVersions(ListVersionsRequest) returns (ListVersionsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Create an alias, or move an existing one to a different version. This is the
  // promote/rollback operation: deliberate, audited, and never a side effect of
  // deploying. Carries its own authz action so "may promote, may not deploy" is
  // expressible.
  rpc SetTaskAlias(SetTaskAliasRequest) returns (SetTaskAliasResponse) {}

  // Resolve an alias to its current version, with who moved it there and when.
  rpc GetTaskAlias(GetTaskAliasRequest) returns (GetTaskAliasResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // List every alias defined for a task.
  rpc ListTaskAliases(ListTaskAliasesRequest) returns (ListTaskAliasesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Remove an alias. The versions it pointed at are unaffected.
  rpc DeleteTaskAlias(DeleteTaskAliasRequest) returns (DeleteTaskAliasResponse) {}

  // Full move history for one alias: every from -> to, who, when.
  rpc GetTaskAliasHistory(GetTaskAliasHistoryRequest) returns (GetTaskAliasHistoryResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// Request message for deploying a task.
message DeployTaskRequest {
  // The user provided task id.
  TaskIdentifier task_id = 1 [(buf.validate.field).required = true];

  // Specification for the task.
  TaskSpec spec = 2 [(buf.validate.field).required = true];

  // Optional, set of triggers for a given task. Replaces previous set of triggers entirely if any.
  repeated TaskTrigger triggers = 3;
}

// Response message for deploying a task.
message DeployTaskResponse {}

// Request message for getting detailed information about a task.
message GetTaskDetailsRequest {
  // Id of the task.
  TaskIdentifier task_id = 1 [(buf.validate.field).required = true];
}

// Response message for deploying a task.
message GetTaskDetailsResponse {
  // Detailed information about the task.
  TaskDetails details = 1;
}

message ListTasksRequest {
  // Common list request parameters.
  common.ListRequest request = 1;

  oneof scope_by {
    option (buf.validate.oneof).required = true;

    // Organization name for filtering.
    string org = 2 [(buf.validate.field).string.min_len = 1];

    // Project identifier for filtering.
    common.ProjectIdentifier project_id = 3;
  }

  message KnownFilter {
    oneof filter_by {
      // Filter by user
      string deployed_by = 1;

      // Filter to only entrypoint tasks
      bool is_entrypoint = 2;
    }
  }

  // Known filters for listing tasks.
  repeated KnownFilter known_filters = 4;
}

message ListTasksResponse {
  repeated Task tasks = 1;

  // Pagination token for the next page of tasks.
  string token = 2;

  message ListTasksMetadata {
    // Total number of tasks without filters applied
    uint32 total = 1;

    // Total number of tasks matching the applied filters.
    uint32 filtered_total = 2;
  }

  // Metadata for the ListTasksResponse
  ListTasksMetadata metadata = 3;
}

// Request message for listing versions for a task.
message ListVersionsRequest {
  // Common list request parameters.
  common.ListRequest request = 1;

  // Id of the task.
  TaskName task_name = 2 [(buf.validate.field).required = true];
}

// Response message for listing versions.
message ListVersionsResponse {
  message VersionResponse {
    string version = 1;

    // The time the task version was deployed
    google.protobuf.Timestamp deployed_at = 2 [(buf.validate.field).required = true];

    // Identity that deployed this version
    common.EnrichedIdentity deployed_by = 3 [(buf.validate.field).required = true];

    // Summary of the latest run for this version, if any
    optional LatestRunSummary latest_run = 4;
  }

  // Version with deployed_at
  repeated VersionResponse versions = 1;

  // Pagination token for the next page of versions.
  string token = 2;
}

// Names one alias on one task. Aliases are scoped per (org, project, domain, task
// name), so "prod" in staging and "prod" in production are distinct pointers.
message TaskAliasName {
  TaskName task_name = 1 [(buf.validate.field).required = true];

  string alias = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 63
  ];
}

// A mutable named pointer to an immutable task version.
message TaskAlias {
  TaskAliasName name = 1 [(buf.validate.field).required = true];

  // The immutable version this alias currently resolves to.
  string version = 2;

  // Identity that last set or moved this alias.
  common.EnrichedIdentity set_by = 3;

  // When it was last set or moved.
  google.protobuf.Timestamp set_at = 4;
}

// One entry in an alias's move history.
message TaskAliasRevision {
  // Version the alias pointed at before this change. Empty when the alias was created.
  string from_version = 1;

  // Version the alias pointed at after this change.
  string to_version = 2;

  common.EnrichedIdentity changed_by = 3;

  google.protobuf.Timestamp changed_at = 4;
}

message SetTaskAliasRequest {
  TaskAliasName name = 1 [(buf.validate.field).required = true];

  // Target version. Must already be deployed; setting an alias to a version that
  // does not exist is an error rather than a pointer that fails at launch time.
  string version = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 63
  ];
}

message SetTaskAliasResponse {
  TaskAlias alias = 1;

  // Version the alias pointed at before this call. Empty when it was just created.
  // Lets a client render "prod: v1.4.0 -> v1.7.0" without a second lookup.
  string previous_version = 2;
}

message GetTaskAliasRequest {
  TaskAliasName name = 1 [(buf.validate.field).required = true];
}

message GetTaskAliasResponse {
  TaskAlias alias = 1;
}

message ListTaskAliasesRequest {
  TaskName task_name = 1 [(buf.validate.field).required = true];

  common.ListRequest request = 2;
}

message ListTaskAliasesResponse {
  repeated TaskAlias aliases = 1;

  string token = 2;
}

message DeleteTaskAliasRequest {
  TaskAliasName name = 1 [(buf.validate.field).required = true];
}

message DeleteTaskAliasResponse {}

message GetTaskAliasHistoryRequest {
  TaskAliasName name = 1 [(buf.validate.field).required = true];

  common.ListRequest request = 2;
}

message GetTaskAliasHistoryResponse {
  // Newest first.
  repeated TaskAliasRevision revisions = 1;

  string token = 2;
}
