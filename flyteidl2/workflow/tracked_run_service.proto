syntax = "proto3";

package flyteidl2.workflow;

import "buf/validate/validate.proto";
import "flyteidl2/common/identifier.proto";
import "flyteidl2/common/run.proto";
import "flyteidl2/logs/dataplane/payload.proto";
import "flyteidl2/task/common.proto";
import "flyteidl2/task/run.proto";
import "flyteidl2/task/task_definition.proto";
import "flyteidl2/workflow/run_definition.proto";
import "flyteidl2/workflow/run_service.proto";
import "google/protobuf/timestamp.proto";
import "google/rpc/status.proto";

option go_package = "github.com/flyteorg/flyte/v2/gen/go/flyteidl2/workflow";

// TrackedRunService records runs that are orchestrated OUTSIDE the platform: the client executes
// the work itself — on a laptop, in CI, inside an agent framework — and reports the resulting
// action tree here. The platform never schedules these runs and no dataplane is involved; it
// stores what it is told and streams it back.
//
// Tracked runs are tracked separately from platform-orchestrated runs so that reported,
// client-supplied state can never be mistaken for execution state the platform owns.
//
// The read/watch surface deliberately mirrors RunService (same request/response messages) so that
// clients and UIs built against RunService work against tracked runs with only a service swap.
service TrackedRunService {
  // Register a new tracked run. The server creates the root action ("a0") in the reported state and
  // returns the resolved run. If a run name is not provided, the server generates one.
  rpc CreateRun(CreateTrackedRunRequest) returns (CreateRunResponse) {}

  // Report state for one or more actions of a tracked run. Creates actions on first report and
  // updates them on subsequent reports. Reports are idempotent: an event with an
  // (attempt, version, phase) tuple that was already recorded is acknowledged as success.
  rpc ReportActions(ReportTrackedActionsRequest) returns (ReportTrackedActionsResponse) {}

  // Get detailed information about a tracked run.
  rpc GetRunDetails(GetRunDetailsRequest) returns (GetRunDetailsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Stream detailed information updates about a tracked run. The call will terminate when the run
  // reaches a terminal phase.
  rpc WatchRunDetails(WatchRunDetailsRequest) returns (stream WatchRunDetailsResponse) {}

  // Get detailed information about an action of a tracked run.
  rpc GetActionDetails(GetActionDetailsRequest) returns (GetActionDetailsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Stream detailed information updates about an action of a tracked run. The call will terminate
  // when the action reaches a terminal phase.
  rpc WatchActionDetails(WatchActionDetailsRequest) returns (stream WatchActionDetailsResponse) {}

  // List tracked runs based on the provided filter criteria.
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Stream updates for tracked runs based on the provided filter criteria.
  rpc WatchRuns(WatchRunsRequest) returns (stream WatchRunsResponse) {}

  // List all actions for a given tracked run.
  rpc ListActions(ListActionsRequest) returns (ListActionsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Stream updates for actions of a given tracked run.
  rpc WatchActions(WatchActionsRequest) returns (stream WatchActionsResponse) {}

  // Abort a tracked run: mark the run and all of its non-terminal actions ABORTED on the server.
  // The platform cannot stop the client that owns the run; subsequent reports against aborted actions
  // are rejected. Aborting an already-terminal run is a no-op acknowledged as success.
  rpc AbortRun(AbortRunRequest) returns (AbortRunResponse) {}

  // Offer to serve logs for a tracked run. The platform has no access to the machine the run
  // executes on, so logs can only come from the client itself, while it is still running.
  //
  // The client holds this bidirectional stream open for as long as it is willing to serve logs
  // and the server drives it: rather than the client pushing everything it produces, the server
  // asks for specific logs on demand — when somebody opens the run in the console. Nothing is
  // stored server-side; batches are relayed to whoever is watching and then dropped. For logs
  // that outlive the client, see TrackedActionUpdate.log_tail.
  //
  // The client speaks first with Register, naming the run it can serve. Thereafter the server
  // sends ServeLogs and CancelLogs, and the client answers with LogBatch or LogError messages
  // carrying the matching request_id. Requests may overlap; request_id is what pairs them up.
  //
  // SECURITY: this is the one place where the server names a resource for the client to read,
  // which inverts the usual trust direction. A client MUST check that every requested
  // action_attempt_id belongs to the run it registered, and refuse anything else. Without that
  // check a hostile or impersonated server could use the stream to read logs the user never
  // asked it to open.
  rpc StreamLogs(stream StreamLogsRequest) returns (stream StreamLogsResponse) {}

  // Tail logs for one attempt of a tracked action. Served live from the run's StreamLogs
  // connection when one is registered, and otherwise from the capped tail the client persisted
  // with the attempt's terminal report. Returns FAILED_PRECONDITION when the run has neither —
  // a run whose client exited without persisting a tail has no logs to give, and the caller
  // should be told that rather than shown an empty stream.
  rpc TailLogs(TailTrackedLogsRequest) returns (stream TailTrackedLogsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// Request message for creating a tracked run.
message CreateTrackedRunRequest {
  oneof id {
    option (buf.validate.oneof).required = true;

    // The user provided run id.
    common.RunIdentifier run_id = 1;

    // The project id for this run. Run name will be generated.
    common.ProjectIdentifier project_id = 2;
  }

  // The task this run executes.
  oneof task {
    option (buf.validate.oneof).required = true;

    // The task id to use.
    task.TaskIdentifier task_id = 3;

    // The task spec to use.
    task.TaskSpec task_spec = 4;
  }

  // Reference to the run's inputs, previously uploaded via DataProxyService.UploadMetadata.
  optional common.OffloadedInputData offloaded_input_data = 5;

  // The run spec to use. Only client-relevant fields are honored; dataplane scheduling fields
  // (queue, cluster) are ignored for tracked runs.
  task.RunSpec run_spec = 6;

  // User-defined labels attached to this run at creation time.
  map<string, string> labels = 7;

  // Time the tracked run actually started. If unset, the server defaults it to the current time.
  google.protobuf.Timestamp run_start_time = 8;
}

// A single action state report within a tracked run.
message TrackedActionUpdate {
  // The event describing this state transition. Carries the action id, attempt (starting at 1),
  // phase, monotonically increasing version, timestamps, error info and output references
  // (output_uri / report_uri under the control plane's storage).
  ActionEvent event = 1 [(buf.validate.field).required = true];

  // Name of the parent action if this is a nested action. Empty for the root action. Only
  // honored on the first report of an action.
  string parent_name = 2;

  // Group this action belongs to, if applicable. Only honored on the first report of an action.
  string group = 3;

  // The action's spec. Should be provided on the first report of an action; ignored afterwards.
  oneof spec {
    TaskAction task = 4;
    TraceAction trace = 5;
  }

  // Rolled-up status of the action (attempts count, start/end time).
  ActionStatus status = 6;

  // Tail of this attempt's log output, so that logs survive the client exiting. Only honored on
  // a terminal event; ignored otherwise. The server caps how much it will store and rejects
  // reports that exceed the cap, so clients should keep only the most recent lines.
  LogTail log_tail = 7;
}

// A bounded window of an action attempt's log output, retained after the run's client is gone.
message LogTail {
  // Log lines, oldest first.
  repeated flyteidl2.logs.dataplane.LogLine lines = 1;

  // True when earlier lines were dropped to fit the cap, so readers can say so rather than
  // presenting a partial log as if it were the whole thing.
  bool truncated = 2;
}

// Client -> server message on the StreamLogs stream.
message StreamLogsRequest {
  // Registers this connection as the log source for a run. Must be the first message on the
  // stream, and may be sent only once. The caller must be authorized for the run.
  //
  // At most one connection serves a run at a time: registering again replaces the previous
  // connection, which the server then closes. This is deliberate — a re-run or a reconnect
  // after a network drop should take over rather than be refused.
  message Register {
    // The tracked run whose logs this client can serve.
    common.RunIdentifier run_id = 1 [(buf.validate.field).required = true];
  }

  // Log lines answering a ServeLogs request. A request may be answered by many batches.
  message LogBatch {
    // The request_id from the ServeLogs this answers. Batches for an unknown or already
    // cancelled request_id are ignored.
    string request_id = 1 [(buf.validate.field).string.min_len = 1];

    // Log lines, oldest first.
    repeated flyteidl2.logs.dataplane.LogLine lines = 2;

    // Set on the final batch for this request_id: nothing further will be sent for it. For a
    // follow request this means the attempt ended; otherwise it means the backlog is exhausted.
    bool eof = 3;
  }

  // The client cannot answer a request — the attempt is unknown to it, its log buffer has been
  // discarded, or the request failed the ownership check. The server fails the corresponding
  // watchers; the stream itself stays up and other requests are unaffected.
  message LogError {
    string request_id = 1 [(buf.validate.field).string.min_len = 1];

    google.rpc.Status error = 2 [(buf.validate.field).required = true];
  }

  oneof message {
    option (buf.validate.oneof).required = true;

    Register register = 1;
    LogBatch batch = 2;
    LogError error = 3;
  }
}

// Server -> client message on the StreamLogs stream.
message StreamLogsResponse {
  // Acknowledges Register. Sent once, before any ServeLogs. A client that never sees this
  // should not assume its logs are reachable.
  message Registered {}

  // Asks the client to send logs for one action attempt.
  message ServeLogs {
    // Correlates the client's LogBatch and LogError messages with this request. Unique within
    // the stream.
    string request_id = 1 [(buf.validate.field).string.min_len = 1];

    // The attempt to read. MUST belong to the registered run; see the SECURITY note on
    // StreamLogs — verifying this is the client's responsibility, not the server's promise.
    common.ActionAttemptIdentifier action_attempt_id = 2 [(buf.validate.field).required = true];

    // Send only lines at or after this time. Unset means everything the client still holds.
    google.protobuf.Timestamp from_timestamp = 3;

    // When true, keep sending lines as they are produced, until the attempt ends or the server
    // cancels. When false, send what is buffered and close the request with eof.
    bool follow = 4;
  }

  // Withdraws an earlier ServeLogs because the last watcher went away. The client stops sending
  // batches for this request_id. Cancelling an unknown request_id is not an error.
  message CancelLogs {
    string request_id = 1 [(buf.validate.field).string.min_len = 1];
  }

  oneof message {
    option (buf.validate.oneof).required = true;

    Registered registered = 1;
    ServeLogs serve = 2;
    CancelLogs cancel = 3;
  }
}

// Request message for tailing a tracked action attempt's logs.
message TailTrackedLogsRequest {
  // The action attempt to tail.
  common.ActionAttemptIdentifier action_attempt_id = 1 [(buf.validate.field).required = true];

  // Keep the stream open and forward lines as they are produced. Only meaningful while the
  // run's client is connected; a persisted tail is always sent in full and then completed.
  bool follow = 2;
}

// Response message for tailing a tracked action attempt's logs.
message TailTrackedLogsResponse {
  // Where the lines came from. Readers should surface this: a persisted tail is a bounded
  // window, not the whole log, and it never grows.
  enum Source {
    SOURCE_UNSPECIFIED = 0;

    // Relayed from the run's client over its StreamLogs connection.
    SOURCE_LIVE = 1;

    // Read back from the tail persisted with the attempt's terminal report.
    SOURCE_PERSISTED = 2;
  }

  // Log lines, oldest first.
  repeated flyteidl2.logs.dataplane.LogLine lines = 1;

  Source source = 2;

  // True when earlier lines are missing from what is being sent.
  bool truncated = 3;
}

// Request message for reporting tracked action state.
message ReportTrackedActionsRequest {
  // The run these action reports belong to. Every update's action id must reference this run.
  common.RunIdentifier run_id = 1 [(buf.validate.field).required = true];

  // The action state reports.
  repeated TrackedActionUpdate updates = 2 [(buf.validate.field).repeated.min_items = 1];
}

// Response message for reporting tracked action state.
message ReportTrackedActionsResponse {
  // Per-update results, parallel to the request's updates. Duplicate (already recorded) events
  // are reported as success.
  repeated google.rpc.Status statuses = 1;
}
