syntax = "proto3";

package flyteidl2.artifact;

import "buf/validate/validate.proto";
import "flyteidl2/common/identifier.proto";
import "flyteidl2/common/identity.proto";
import "flyteidl2/core/artifact_id.proto";
import "flyteidl2/core/literals.proto";
import "flyteidl2/core/types.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/flyteorg/flyte/v2/gen/go/flyteidl2/artifact";

// Identifies an artifact name within an org, project and domain.
message ArtifactName {
  // Org this artifact belongs to. Stamped by the server from the caller's
  // identity; clients may leave this empty.
  string org = 1 [(buf.validate.field).string.max_len = 63];

  // Project this artifact belongs to.
  string project = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 64
  ];

  // Domain this artifact belongs to.
  string domain = 3 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 64
  ];

  // Unique name of the artifact within org/project/domain.
  string name = 4 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 255
  ];
}

// Fully qualified identifier of a single artifact version.
message ArtifactIdentifier {
  ArtifactName name = 1 [(buf.validate.field).required = true];

  // Version of the artifact.
  string version = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 255
  ];
}

// The task action attempt that produced an artifact. A dedicated message
// (rather than common.ActionAttemptIdentifier) because producing attempts are
// 0-based while that identifier validates attempt > 0.
message TaskActionSource {
  common.ActionIdentifier action = 1 [(buf.validate.field).required = true];

  // Attempt of the producing action; retries are distinct provenance.
  uint32 attempt = 2;
}

// Provenance of an artifact: what produced it. An unset oneof means the
// artifact was created manually (e.g. published from a laptop) with no
// specific origin.
message ArtifactSource {
  oneof source {
    // The task action that produced this artifact, for artifacts published
    // from inside a running task or extracted by the backend from task
    // outputs.
    TaskActionSource task_action = 1;

    // Opaque reference into an external system (a URI, model id, dataset id,
    // ticket, ...) for artifacts imported from outside Flyte.
    string external_ref = 2 [(buf.validate.field).string.max_len = 1024];
  }
}

// User-provided specification of an artifact.
message ArtifactSpec {
  // The typed value of the artifact. Offloaded data (files, directories,
  // dataframes) must already reside in blob storage; the literal references
  // it by uri.
  core.Literal value = 1 [(buf.validate.field).required = true];

  // The Flyte type of the value.
  core.LiteralType type = 2 [(buf.validate.field).required = true];

  // Descriptive payload (description, user metadata, card). Shared with the
  // production declaration (task.ProducedArtifact.info), so task-produced
  // artifacts carry it verbatim.
  core.ArtifactInfo info = 3;

  // Optional provenance: what produced this artifact. Clients (including the
  // SDK, which stamps this automatically when publishing from inside a
  // running task) declare it at creation time; it is immutable afterwards.
  ArtifactSource source = 6;

  // Optional lineage: the artifact versions this one was derived from. Empty
  // means no declared parents, which is the normal case for a first version or
  // an independently produced one. One entry is plain derivation; several
  // entries record a merge (git-style), making version history a DAG rather
  // than a chain: a new version may branch off any earlier version — or
  // combine more than one — so two versions derived from the same ancestor
  // are siblings rather than one appearing to descend from the other.
  //
  // Order is preserved and meaningful: the first entry is the primary parent
  // (the version this one is "a new revision of"), later entries are the
  // versions merged in. Duplicate parents (after inheritance is applied) are
  // rejected.
  //
  // Every parent must live in this artifact's own org/project/domain; empty
  // scope fields on a key inherit the artifact's own scope, and an empty
  // key name inherits the artifact's own name — so a bare {version: "v1"}
  // declares the previous version of this same artifact as a parent. The name
  // MAY differ, so lineage can express derivation across artifacts (a model
  // deriving from a dataset version).
  //
  // Stored as given and never resolved: referenced versions are not required
  // to exist (publication order is not guaranteed), so readers walking lineage
  // must tolerate dangling parents. Immutable after creation.
  repeated core.ArtifactVersionId parent_artifacts = 7 [(buf.validate.field).repeated.max_items = 32];
}

// A fully materialized artifact as stored by the service.
message Artifact {
  ArtifactIdentifier artifact_id = 1;

  ArtifactSpec spec = 2;

  // Time at which the artifact was created.
  google.protobuf.Timestamp created_at = 3;

  // Identity that created the artifact. Persisted subject-stripped; services
  // re-enrich via the identity cache when serving (same convention as
  // workflow.ActionMetadata.executed_by).
  common.EnrichedIdentity created_by = 4;
}
