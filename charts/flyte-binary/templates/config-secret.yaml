{{- if not (include "flyte-binary.configuration.externalConfiguration" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flyte-binary.configuration.configSecretName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "flyte-binary.labels" . | nindent 4 }}
    {{- if .Values.commonLabels }}
    {{- tpl ( .Values.commonLabels | toYaml ) . | nindent 4 }}
    {{- end }}
    {{- if .Values.configuration.labels }}
    {{- tpl ( .Values.configuration.labels | toYaml ) . | nindent 4 }}
    {{- end }}
  annotations:
    {{- if .Values.commonAnnotations }}
    {{- tpl ( .Values.commonAnnotations | toYaml ) . | nindent 4 }}
    {{- end }}
    {{- if .Values.configuration.annotations }}
    {{- tpl ( .Values.configuration.annotations | toYaml ) . | nindent 4 }}
    {{- end }}
type: Opaque
stringData:
  {{- if .Values.configuration.database.postgres.password }}
  012-database-secrets.yaml: |
    runs:
      database:
        postgres:
          password: {{ .Values.configuration.database.postgres.password | quote }}
  {{- end }}
  {{- if eq "s3" .Values.configuration.storage.provider }}
  {{- if eq "accesskey" .Values.configuration.storage.providerConfig.s3.authType }}
  013-storage-secrets.yaml: |
    storage:
      stow:
        config:
          access_key_id: {{ required "Access key required for S3 storage provider" .Values.configuration.storage.providerConfig.s3.accessKey | quote }}
          {{- if .Values.configuration.storage.providerConfig.s3.secretKey }}
          secret_key: {{ .Values.configuration.storage.providerConfig.s3.secretKey | quote }}
          {{- else if .Values.configuration.storage.providerConfig.s3.secretKeyPath}}
          secret_key_path: {{ .Values.configuration.storage.providerConfig.s3.secretKeyPath | quote }}
          {{- else }}
          {{ fail "secretKey or secretKeyPath must be configured" }}
          {{- end }}
  {{- end }}
  {{- end }}
{{- if and (include "flyte-binary.configuration.copilotStorageComplete" .) (not .Values.configuration.storage.copilotStorageSecretRef) }}
---
{{/*
Co-pilot's storage configuration. Separate from the configuration Secret above because that
one also holds the database password, which has no business being mountable from a task pod.
The stow settings and credentials are repeated here in a single key deliberately: co-pilot
takes the stow config all-or-nothing, so a partial file leaves it with no credentials.

Rendered into the task-pod namespace, not the release namespace: a pod can only project
Secrets from its own namespace.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flyte-binary.configuration.copilotStorageSecretName" . }}
  namespace: {{ tpl (index .Values "flyte-core-components" "actions" "kubernetes" "namespace") . | quote }}
  labels: {{- include "flyte-binary.labels" . | nindent 4 }}
    {{- if .Values.commonLabels }}
    {{- tpl ( .Values.commonLabels | toYaml ) . | nindent 4 }}
    {{- end }}
    {{- if .Values.configuration.labels }}
    {{- tpl ( .Values.configuration.labels | toYaml ) . | nindent 4 }}
    {{- end }}
  annotations:
    {{- if .Values.commonAnnotations }}
    {{- tpl ( .Values.commonAnnotations | toYaml ) . | nindent 4 }}
    {{- end }}
    {{- if .Values.configuration.annotations }}
    {{- tpl ( .Values.configuration.annotations | toYaml ) . | nindent 4 }}
    {{- end }}
type: Opaque
stringData:
  # Key name fixed by the plugin (copilotStorageConfigKey); the .yaml suffix is what makes
  # co-pilot's *.yaml glob find it, so a renamed key is silently never read.
  copilot-storage-config.yaml: |
    {{- include "flyte-binary.configuration.storageBlock" (dict "root" $ "withCredentials" true) | nindent 4 }}
{{- end }}
{{- end }}
