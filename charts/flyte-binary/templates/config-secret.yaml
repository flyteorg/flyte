{{- if not (include "flyte-binary.configuration.externalConfiguration" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flyte-binary.configuration.configSecretName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "flyte-binary.labels" . | nindent 4 }}
    {{- if .Values.commonLabels }}
    {{- tpl ( .Values.commonLabels | toYaml ) . | nindent 4 }}
    {{- end }}
    {{- if .Values.configuration.labels }}
    {{- tpl ( .Values.configuration.labels | toYaml ) . | nindent 4 }}
    {{- end }}
  annotations:
    {{- if .Values.commonAnnotations }}
    {{- tpl ( .Values.commonAnnotations | toYaml ) . | nindent 4 }}
    {{- end }}
    {{- if .Values.configuration.annotations }}
    {{- tpl ( .Values.configuration.annotations | toYaml ) . | nindent 4 }}
    {{- end }}
type: Opaque
stringData:
  {{- if .Values.configuration.database.postgres.password }}
  012-database-secrets.yaml: |
    runs:
      database:
        postgres:
          password: {{ .Values.configuration.database.postgres.password | quote }}
  {{- end }}
  {{- if eq "s3" .Values.configuration.storage.provider }}
  {{- if eq "accesskey" .Values.configuration.storage.providerConfig.s3.authType }}
  013-storage-secrets.yaml: |
    storage:
      stow:
        config:
          access_key_id: {{ required "Access key required for S3 storage provider" .Values.configuration.storage.providerConfig.s3.accessKey | quote }}
          {{- if .Values.configuration.storage.providerConfig.s3.secretKey }}
          secret_key: {{ .Values.configuration.storage.providerConfig.s3.secretKey | quote }}
          {{- else if .Values.configuration.storage.providerConfig.s3.secretKeyPath}}
          secret_key_path: {{ .Values.configuration.storage.providerConfig.s3.secretKeyPath | quote }}
          {{- else }}
          {{ fail "secretKey or secretKeyPath must be configured" }}
          {{- end }}
  {{- end }}
  {{- end }}
{{- if and (include "flyte-binary.configuration.copilotStorageComplete" .) (not .Values.configuration.storage.copilotStorageSecretRef) }}
---
{{/*
Co-pilot's storage configuration, complete in a single key so only one file has to be
projected into every task pod. The stow settings repeat the ones the ConfigMap renders into
003-storage.yaml and the credentials repeat 013-storage-secrets.yaml, deliberately: co-pilot
takes the stow config all-or-nothing, so a partial file leaves it with no credentials at all
rather than falling back to the rest.

A Secret rather than the ConfigMap because it carries credentials, and separate from the
configuration Secret because that one also holds the database password — which has no
business being mountable from a task pod.

Changes to the storage block in configmap.yaml (003-storage.yaml) must be mirrored here.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flyte-binary.configuration.copilotStorageSecretName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "flyte-binary.labels" . | nindent 4 }}
    {{- if .Values.commonLabels }}
    {{- tpl ( .Values.commonLabels | toYaml ) . | nindent 4 }}
    {{- end }}
    {{- if .Values.configuration.labels }}
    {{- tpl ( .Values.configuration.labels | toYaml ) . | nindent 4 }}
    {{- end }}
  annotations:
    {{- if .Values.commonAnnotations }}
    {{- tpl ( .Values.commonAnnotations | toYaml ) . | nindent 4 }}
    {{- end }}
    {{- if .Values.configuration.annotations }}
    {{- tpl ( .Values.configuration.annotations | toYaml ) . | nindent 4 }}
    {{- end }}
type: Opaque
stringData:
  # The key name and the .yaml suffix are fixed by the plugin (copilotStorageConfigKey):
  # co-pilot is pointed at the mount directory with a *.yaml glob, and viper infers the
  # format from the extension, so a renamed or unsuffixed key is silently never read.
  copilot-storage-config.yaml: |
    {{- with .Values.configuration.storage }}
    storage:
      type: stow
      stow:
        {{- if eq "s3" .provider }}
        {{- with .providerConfig.s3 }}
        kind: s3
        config:
          region: {{ required "Region required for S3 storage provider" .region }}
          disable_ssl: {{ .disableSSL }}
          v2_signing: {{ .v2Signing }}
          {{- if .endpoint }}
          endpoint: {{ tpl .endpoint $ }}
          {{- end }}
          {{- if eq "iam" .authType }}
          auth_type: iam
          {{- else if eq "accesskey" .authType }}
          auth_type: accesskey
          access_key_id: {{ required "Access key required for S3 storage provider" .accessKey | quote }}
          secret_key: {{ required "secretKey required for co-pilot storage configuration" .secretKey | quote }}
          {{- else }}
          {{- printf "Invalid value for S3 storage provider authentication type. Expected one of (iam, accesskey), but got: %s" .authType | fail }}
          {{- end }}
        {{- end }}
        {{- else if eq "azure" .provider }}
        {{- with .providerConfig.azure }}
        kind: azure
        config:
          account: {{ .account }}
          {{- if .key }}
          key: {{ .key }}
          {{- end }}
          {{- if .configDomainSuffix }}
          configDomainSuffix: {{ .configDomainSuffix }}
          {{- end }}
          {{- if .configUploadConcurrency }}
          configUploadConcurrency: {{ .configUploadConcurrency }}
          {{- end }}
        {{- end }}
        {{- else if eq "gcs" .provider }}
        kind: google
        config:
          json: ""
          project_id: {{ required "GCP project required for GCS storage provider" .providerConfig.gcs.project }}
          scopes: https://www.googleapis.com/auth/cloud-platform
        {{- else }}
        {{- printf "Invalid value for storage provider. Expected one of (s3, gcs), but got: %s" .provider | fail }}
        {{- end }}
      container: {{ required "Metadata container required" .metadataContainer }}
    {{- end }}
{{- end }}
{{- end }}
