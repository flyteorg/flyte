{{- /*
  Co-pilot's S3 credentials, keyed by the environment variable names the AWS SDK reads.
  Injected into the co-pilot containers with envFrom so that only this Secret's name — not
  the credentials — appears in a task's pod spec.

  Separate from the configuration Secret rather than another key in it: envFrom injects
  each key under its own name, and the configuration Secret's keys are config filenames
  (013-storage-secrets.yaml), which are not valid environment variable names.

  Only rendered for S3 with an inline secretKey. authType=iam has no keys to inject, and
  co-pilot resolves credentials from the pod's own identity instead. A deployment using
  secretKeyPath keeps its secret in a file this chart cannot read, so it supplies its own
  Secret via storage.copilotCredentialsSecretRef; without that, co-pilot falls back to
  receiving the credentials on its command line, as it did before.
*/}}
{{- if not (include "flyte-binary.configuration.externalConfiguration" .) }}
{{- if eq "s3" .Values.configuration.storage.provider }}
{{- if eq "accesskey" .Values.configuration.storage.providerConfig.s3.authType }}
{{- if .Values.configuration.storage.providerConfig.s3.secretKey }}
{{- if not .Values.configuration.storage.copilotCredentialsSecretRef }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flyte-binary.configuration.copilotStorageSecretName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "flyte-binary.labels" . | nindent 4 }}
    {{- if .Values.commonLabels }}
    {{- tpl ( .Values.commonLabels | toYaml ) . | nindent 4 }}
    {{- end }}
    {{- if .Values.configuration.labels }}
    {{- tpl ( .Values.configuration.labels | toYaml ) . | nindent 4 }}
    {{- end }}
  annotations:
    {{- if .Values.commonAnnotations }}
    {{- tpl ( .Values.commonAnnotations | toYaml ) . | nindent 4 }}
    {{- end }}
    {{- if .Values.configuration.annotations }}
    {{- tpl ( .Values.configuration.annotations | toYaml ) . | nindent 4 }}
    {{- end }}
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: {{ required "Access key required for S3 storage provider" .Values.configuration.storage.providerConfig.s3.accessKey | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.configuration.storage.providerConfig.s3.secretKey | quote }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
