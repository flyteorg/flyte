{{- if not (include "flyte-binary.configuration.externalConfiguration" .) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "flyte-binary.configuration.configMapName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "flyte-binary.labels" . | nindent 4 }}
    {{- if .Values.commonLabels }}
    {{- tpl ( .Values.commonLabels | toYaml ) . | nindent 4 }}
    {{- end }}
    {{- if .Values.configuration.labels }}
    {{- tpl ( .Values.configuration.labels | toYaml ) . | nindent 4 }}
    {{- end }}
  annotations:
    {{- if .Values.commonAnnotations }}
    {{- tpl ( .Values.commonAnnotations | toYaml ) . | nindent 4 }}
    {{- end }}
    {{- if .Values.configuration.annotations }}
    {{- tpl ( .Values.configuration.annotations | toYaml ) . | nindent 4 }}
    {{- end }}
data:
  000-core.yaml: |
    logger:
      show-source: true
      level: {{ default 1 .Values.configuration.logging.level }}
    webhook:
      certDir: /var/run/flyte/certs
      localCert: true
      secretName: {{ include "flyte-binary.webhook.secretName" . }}
      serviceName: {{ include "flyte-binary.webhook.serviceName" . }}
      servicePort: 443
      secretManagerTypes:
        - Embedded
      embeddedSecretManagerConfig:
        type: K8s
        k8sConfig:
          namespace: {{ .Release.Namespace }}
{{ tpl ( index .Values "flyte-core-components" | toYaml ) . | nindent 4 }}
  001-plugins.yaml: |
    tasks:
      {{- .Values.enabled_plugins.tasks | toYaml | nindent 6 }}
    plugins:
      logs: {{- include "flyte-binary.configuration.logging.plugins" . | nindent 8 }}
      k8s:
        co-pilot:
          {{- with ( index .Values.configuration "co-pilot" ).image }}
          image: {{ printf "%s:%s" .repository .tag | quote }}
          {{- end }}
          {{- if include "flyte-binary.configuration.copilotStorageComplete" . }}
          # Co-pilot reads its storage configuration from this Secret instead of its command
          # line, keeping the credentials out of every task's pod spec. Emitted only when
          # that file would be complete; see copilotStorageComplete.
          copilot-storage-config: {{ .Values.configuration.storage.copilotStorageSecretRef | default (include "flyte-binary.configuration.copilotStorageSecretName" .) | quote }}
          {{- end }}
        # Env vars injected into every task pod, so it can reach the control plane
        # to enqueue child actions and watch their state.
        #
        #   - _U_EP_OVERRIDE: where the task reaches the control plane. Defaults to
        #     this release's in-cluster HTTP service, <fullname>-http.<namespace>:8090.
        #   - _U_INSECURE: talk plain HTTP — the in-cluster service has no TLS
        #     (TLS terminates at the ingress).
        #   - _U_USE_ACTIONS: use the actions/queue execution path.
        #
        # Override or extend via configuration.inline.plugins.k8s.default-env-vars.
        default-env-vars:
          - _U_EP_OVERRIDE: {{ printf "%s.%s:%s" (include "flyte-binary.service.http.name" .) .Release.Namespace (include "flyte-binary.service.http.port" .) | quote }}
          - _U_INSECURE: "true"
          - _U_USE_ACTIONS: "1"
      k8s-array:
        logs:
          config: {{- include "flyte-binary.configuration.logging.plugins" . | nindent 12 }}
  002-database.yaml: |
    {{- with .Values.configuration.database }}
    {{- /* Render under runs.database — the single DB config the unified binary
           reads (runsconfig.GetConfig().Database). Strip the password: it is
           provided via the config Secret (012-database-secrets.yaml) and must
           not leak into this ConfigMap in plaintext. */}}
    {{- $database := deepCopy . }}
    {{- if $database.postgres }}{{- $_ := unset $database.postgres "password" }}{{- end }}
    runs:
      database: {{- tpl ( $database | toYaml ) $ | nindent 8 }}
    {{- end }}
  003-storage.yaml: |
    {{- include "flyte-binary.configuration.storageBlock" (dict "root" $ "withCredentials" false) | nindent 4 }}
  {{- if .Values.configuration.inline }}
  100-inline-config.yaml: |
    {{- tpl ( .Values.configuration.inline | toYaml ) . | nindent 4 }}
  {{- end }}
{{- end }}
