{{- if or ( index .Values "flyte-binary" "enabled" ) .Values.sandbox.dev }}
{{- $backendService := "" }}
{{- if index .Values "flyte-binary" "enabled" }}
{{- $backendService = printf "%s-http" ( index .Values "flyte-binary" "fullnameOverride" | default "flyte-binary" ) }}
{{- else }}
{{- $backendService = include "flyte-devbox.localHeadlessService" . }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "flyte-devbox.fullname" . }}-api
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "flyte-devbox.labels" . | nindent 4 }}
spec:
  rules:
    - http:
        paths:
          {{- range $path := list "/healthz" "/readyz" }}
          - path: {{ $path }}
            pathType: Exact
            backend:
              service:
                name: {{ $backendService }}
                port:
                  number: 8090
          {{- end }}
          - path: /flyteidl2.
            pathType: Prefix
            backend:
              service:
                name: {{ $backendService }}
                port:
                  number: 8090
{{- end }}
---
{{- $consoleService := "" }}
{{- $consoleBasePath := "" }}
{{- if index .Values "flyte-binary" "enabled" }}
{{- $consoleService = printf "%s-console" ( index .Values "flyte-binary" "fullnameOverride" | default "flyte-binary" ) }}
{{- $consoleBasePath = dig "console" "basePath" "/v2" ( index .Values "flyte-binary" ) }}
{{- else if and .Values.sandbox.dev .Values.sandbox.console.enabled }}
{{- $consoleService = printf "%s-console" ( include "flyte-devbox.fullname" . ) }}
{{- $consoleBasePath = .Values.sandbox.console.basePath | default "/v2" }}
{{- end }}
{{- if $consoleService }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flyte-console
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "flyte-devbox.labels" . | nindent 4 }}
spec:
  rules:
    - http:
        paths:
          - path: {{ $consoleBasePath }}
            pathType: Prefix
            backend:
              service:
                name: {{ $consoleService }}
                port:
                  number: 80
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "flyte-devbox.fullname" . }}-root-to-console
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "flyte-devbox.labels" . | nindent 4 }}
spec:
  redirectRegex:
    # Send the bare host to the console. Without this, http://localhost:30080/
    # falls through to the rustfs S3 catch-all below and answers with an S3 XML
    # error, which reads as "the devbox is broken" to anyone who opens the root
    # URL to check whether it came up.
    regex: "^(https?://[^/]+)/?$"
    replacement: "${1}{{ $consoleBasePath }}"
    # Temporary, so browsers don't cache the hop if the console ever moves.
    permanent: false
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flyte-console-root-redirect
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "flyte-devbox.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: {{ printf "%s-%s-root-to-console@kubernetescrd" .Release.Namespace ( include "flyte-devbox.fullname" . ) | quote }}
    # Traefik derives router priority from rule length, so this route's
    # Path(`/`) would lose to the rustfs PathPrefix(`/`) below. Pin it higher.
    traefik.ingress.kubernetes.io/router.priority: "1000"
spec:
  rules:
    - http:
        paths:
          # Exact, so only the bare root redirects
          - path: /
            pathType: Exact
            backend:
              # Never actually reached: the middleware redirects first. Traefik
              # still requires a resolvable backend on the route.
              service:
                name: {{ $consoleService }}
                port:
                  number: 80
{{- end }}
---
{{- if .Values.rustfs.enabled}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rustfs-console
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "flyte-devbox.labels" . | nindent 4 }}
spec:
  rules:
    - http:
        paths:
          - path: /rustfs/console
            pathType: Prefix
            backend:
              service:
                name: rustfs-svc
                port:
                  number: 9001
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rustfs-s3
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "flyte-devbox.labels" . | nindent 4 }}
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rustfs-svc
                port:
                  number: 9000
{{- end }}
---