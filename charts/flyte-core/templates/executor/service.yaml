{{- $root := . -}}
{{- $name := "executor" -}}
{{- $component := $root.Values.components.executor -}}
{{- if $component.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "flyte-core.componentName" (dict "root" $root "component" $name) }}
  namespace: {{ $root.Release.Namespace | quote }}
  labels:
    {{- include "flyte-core.componentLabels" (dict "root" $root "component" $name) | nindent 4 }}
    {{- with $component.service.labels }}
    {{- tpl (toYaml .) $root | nindent 4 }}
    {{- end }}
  {{- if or $root.Values.commonAnnotations $component.service.annotations }}
  annotations:
    {{- with $root.Values.commonAnnotations }}
    {{- tpl (toYaml .) $root | nindent 4 }}
    {{- end }}
    {{- with $component.service.annotations }}
    {{- tpl (toYaml .) $root | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  type: {{ $component.service.type }}
  {{- with $component.service.clusterIP }}
  clusterIP: {{ . }}
  {{- end }}
  ports:
    - name: webhook
      port: {{ $root.Values.configuration.webhook.listenPort }}
      targetPort: webhook
      protocol: TCP
    - name: cache-internal
      port: {{ $root.Values.configuration.webhook.cacheInvalidationPort }}
      targetPort: cache-internal
      protocol: TCP
    - name: metrics
      port: {{ $root.Values.configuration.executor.metricsPort }}
      targetPort: metrics
      protocol: TCP
    - name: health
      port: {{ $root.Values.configuration.executor.healthProbePort }}
      targetPort: health
      protocol: TCP
  selector:
    {{- include "flyte-core.componentSelectorLabels" (dict "root" $root "component" $name) | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "flyte-core.executorCacheServiceName" $root }}
  namespace: {{ $root.Release.Namespace | quote }}
  labels:
    {{- include "flyte-core.componentLabels" (dict "root" $root "component" $name) | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: cache-internal
      port: {{ $root.Values.configuration.webhook.cacheInvalidationPort }}
      targetPort: cache-internal
      protocol: TCP
  selector:
    {{- include "flyte-core.componentSelectorLabels" (dict "root" $root "component" $name) | nindent 4 }}
{{- end }}
