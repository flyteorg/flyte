{{- $name := "cache" }}
{{- $component := .Values.components.cache }}
{{- if $component.enabled }}
{{- $image := $component.image }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flyte-core.componentName" (dict "root" $ "component" $name) }}
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    {{- include "flyte-core.componentLabels" (dict "root" $ "component" $name) | nindent 4 }}
  {{- with $.Values.commonAnnotations }}
  annotations:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ $component.replicaCount }}
  {{- with $component.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "flyte-core.componentSelectorLabels" (dict "root" $ "component" $name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "flyte-core.componentSelectorLabels" (dict "root" $ "component" $name) | nindent 8 }}
        {{- with $.Values.commonLabels }}
        {{- tpl (toYaml .) $ | nindent 8 }}
        {{- end }}
        {{- with $component.podLabels }}
        {{- tpl (toYaml .) $ | nindent 8 }}
        {{- end }}
      annotations:
        {{- if not (include "flyte-core.externalConfiguration" $) }}
        checksum/configuration: {{ include (print $.Template.BasePath "/cache/configmap.yaml") $ | sha256sum }}
        checksum/configuration-secret: {{ include (print $.Template.BasePath "/config-secret.yaml") $ | sha256sum }}
        {{- end }}
        {{- with $.Values.commonAnnotations }}
        {{- tpl (toYaml .) $ | nindent 8 }}
        {{- end }}
        {{- with $component.podAnnotations }}
        {{- tpl (toYaml .) $ | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ default (include "flyte-core.serviceAccountName" $) $component.serviceAccountName }}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- tpl (toYaml .) $ | nindent 8 }}
      {{- end }}
      {{- with $component.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with $component.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $component.nodeSelector }}
      nodeSelector:
        {{- tpl (toYaml .) $ | nindent 8 }}
      {{- end }}
      {{- with $component.affinity }}
      affinity:
        {{- tpl (toYaml .) $ | nindent 8 }}
      {{- end }}
      {{- with $component.tolerations }}
      tolerations:
        {{- tpl (toYaml .) $ | nindent 8 }}
      {{- end }}
      {{- with $component.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- tpl (toYaml .) $ | nindent 8 }}
      {{- end }}
      {{- with $component.extraPodSpec }}
      {{- tpl (toYaml .) $ | nindent 6 }}
      {{- end }}
      {{- if or (and $.Values.waitForDatabase.enabled (not (include "flyte-core.externalConfiguration" $))) $component.initContainers }}
      initContainers:
        {{- if and $.Values.waitForDatabase.enabled (not (include "flyte-core.externalConfiguration" $)) }}
        - name: wait-for-database
          image: {{ printf "%s:%s" $.Values.waitForDatabase.image.repository $.Values.waitForDatabase.image.tag | quote }}
          imagePullPolicy: {{ $.Values.waitForDatabase.image.pullPolicy }}
          command:
            {{- if $.Values.waitForDatabase.command }}
            {{- tpl (toYaml $.Values.waitForDatabase.command) $ | nindent 12 }}
            {{- else }}
            - sh
            - -ec
            {{- end }}
          args:
            {{- if $.Values.waitForDatabase.args }}
            {{- tpl (toYaml $.Values.waitForDatabase.args) $ | nindent 12 }}
            {{- else }}
            - |
              until pg_isready \
                -h {{ tpl $.Values.configuration.database.postgres.host $ }} \
                -p {{ $.Values.configuration.database.postgres.port }} \
                -U {{ $.Values.configuration.database.postgres.username }}
              do
                echo waiting for database
                sleep 1
              done
            {{- end }}
          {{- with $.Values.waitForDatabase.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $.Values.waitForDatabase.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
        {{- with $component.initContainers }}
        {{- tpl (toYaml .) $ | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ printf "%s:%s" $image.repository $image.tag | quote }}
          imagePullPolicy: {{ $image.pullPolicy }}
          {{- with $component.command }}
          command:
            {{- tpl (toYaml .) $ | nindent 12 }}
          {{- end }}
          {{- with $component.args }}
          args:
            {{- tpl (toYaml .) $ | nindent 12 }}
          {{- end }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- with $component.extraEnv }}
            {{- tpl (toYaml .) $ | nindent 12 }}
            {{- end }}
          {{- with $component.envFrom }}
          envFrom:
            {{- tpl (toYaml .) $ | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ include "flyte-core.componentPort" (dict "root" $ "component" $name) }}
              protocol: TCP
          {{- with $component.startupProbe }}
          startupProbe:
            {{- tpl (toYaml .) $ | nindent 12 }}
          {{- end }}
          livenessProbe:
            {{- if $component.livenessProbe }}
            {{- tpl (toYaml $component.livenessProbe) $ | nindent 12 }}
            {{- else }}
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            {{- end }}
          readinessProbe:
            {{- if $component.readinessProbe }}
            {{- tpl (toYaml $component.readinessProbe) $ | nindent 12 }}
            {{- else }}
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            {{- end }}
          {{- with $component.resources }}
          resources:
            {{- tpl (toYaml .) $ | nindent 12 }}
          {{- end }}
          {{- with $component.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/flyte/config.d
              readOnly: true

            {{- with $component.extraVolumeMounts }}
            {{- tpl (toYaml .) $ | nindent 12 }}
            {{- end }}
        {{- with $component.sidecars }}
        {{- tpl (toYaml .) $ | nindent 8 }}
        {{- end }}
      volumes:
        - name: config
          projected:
            sources:
              {{- if include "flyte-core.externalConfiguration" $ }}
              {{- with $.Values.configuration.externalConfigMap }}
              - configMap:
                  name: {{ tpl . $ }}
              {{- end }}
              {{- with $.Values.configuration.externalSecretRef }}
              - secret:
                  name: {{ tpl . $ }}
              {{- end }}
              {{- else }}
              - configMap:
                  name: {{ include "flyte-core.componentConfigMapName" (dict "root" $ "component" $name) }}
              - secret:
                  name: {{ include "flyte-core.configSecretName" $ }}
              {{- end }}
              {{- with $.Values.configuration.inlineConfigMap }}
              - configMap:
                  name: {{ tpl . $ }}
              {{- end }}
              {{- with $.Values.configuration.inlineSecretRef }}
              - secret:
                  name: {{ tpl . $ }}
              {{- end }}
              {{- range $.Values.configuration.extraInlineConfigMapRefs }}
              - configMap:
                  name: {{ tpl . $ }}
              {{- end }}
              {{- range $.Values.configuration.extraInlineSecretRefs }}
              - secret:
                  name: {{ tpl . $ }}
              {{- end }}

        {{- with $component.extraVolumes }}
        {{- tpl (toYaml .) $ | nindent 8 }}
        {{- end }}
{{- end }}
