{{- if and (not (include "flyte-core.externalConfiguration" .)) .Values.components.cache.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "flyte-core.componentConfigMapName" (dict "root" . "component" "cache") }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "flyte-core.componentLabels" (dict "root" . "component" "cache") | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
data:
  000-core.yaml: |
    {{- include "flyte-core.config.logger" . | nindent 4 }}
    cache_service:
      {{- toYaml .Values.configuration.cache | nindent 6 }}
  002-database.yaml: |
    {{- include "flyte-core.config.database" . | nindent 4 }}
  003-storage.yaml: |
    {{- include "flyte-core.config.storage" . | nindent 4 }}
  {{- with .Values.configuration.inline }}
  100-inline.yaml: |
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
{{- end }}
