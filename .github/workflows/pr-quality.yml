name: PR Quality

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  contents: read
  issues: read
  pull-requests: write

jobs:
  anti-slop:
    name: Screen low-quality pull requests
    runs-on: ubuntu-latest
    steps:
      - name: Check pull request quality
        uses: peakoss/anti-slop@v0.3.0
        with:
          # Require several independent warning signs before taking action to
          # avoid penalizing legitimate contributors for a single heuristic.
          max-failures: 4

          # -- Do NOT close or lock, just label --
          close-pr: false
          lock-pr: false
          failure-add-pr-labels: "Code agent slop"
          failure-pr-message: |
            This PR was flagged by our automated quality checks. If you're a genuine
            contributor, please reply here and a maintainer will review your PR.

            We appreciate your contribution and apologize if this is a false positive!

          # -- Disabled checks (keep minimal) --
          min-profile-completeness: 0
          require-final-newline: false # These trigger on changes to gen
          max-added-comments: 0 # These trigger on changes to gen
